# LEGACY EKS deployment - ISOLATED 2026-10-27. It used to run automatically on
# every push to main with no tests (KNOWN_ISSUES CI-001). It is now manual-only
# and requires typing the confirmation below, so it cannot ship the wrong
# architecture by accident. The supported path is ci.yml + deploy-aws.yml
# (docs/09-deployment-operations/AWS_PRODUCTION_PLAN.md).
name: GawachaBazaar LEGACY EKS Deploy (manual only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY-LEGACY-EKS to confirm"
        required: true

env:
  DOCKER_BACKEND: gawachabazaar-backend
  DOCKER_WEBSITE: gawachabazaar-website
  DOCKER_ADMIN: gawachabazaar-admin
  EKS_CLUSTER: gawachabazaar-prod
  AWS_REGION: ap-south-1
  K8S_NAMESPACE: gawachabazaar
  ADMIN_API_BASE_URL: https://api.gawachabazaar.in/api/v1

jobs:
  build-and-deploy:
    runs-on: ubuntu
    if: ${{ inputs.confirm == 'DEPLOY-LEGACY-EKS' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tools
        run: |
          docker --version
          aws --version
          kubectl version --client

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          echo "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Build backend image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build \
            -t "$DOCKERHUB_USERNAME/$DOCKER_BACKEND:$GITHUB_SHA" \
            ./backend

      - name: Build website image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build \
            -t "$DOCKERHUB_USERNAME/$DOCKER_WEBSITE:$GITHUB_SHA" \
            ./website

      - name: Build Admin image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=$ADMIN_API_BASE_URL" \
            -t "$DOCKERHUB_USERNAME/$DOCKER_ADMIN:$GITHUB_SHA" \
            ./Admin

      - name: Push backend image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker push "$DOCKERHUB_USERNAME/$DOCKER_BACKEND:$GITHUB_SHA"

      - name: Push website image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker push "$DOCKERHUB_USERNAME/$DOCKER_WEBSITE:$GITHUB_SHA"

      - name: Push Admin image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker push "$DOCKERHUB_USERNAME/$DOCKER_ADMIN:$GITHUB_SHA"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Create Docker Hub pull secret
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          kubectl create secret docker-registry dockerhub-regcred \
            -n "$K8S_NAMESPACE" \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="$DOCKERHUB_USERNAME" \
            --docker-password="$DOCKERHUB_TOKEN" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Update backend image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          kubectl -n "$K8S_NAMESPACE" set image \
            deployment/gawachabazaar-backend \
            "backend=$DOCKERHUB_USERNAME/$DOCKER_BACKEND:$GITHUB_SHA"
          kubectl -n "$K8S_NAMESPACE" patch deployment gawachabazaar-backend \
            --type=merge \
            -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"dockerhub-regcred"}]}}}}'

      - name: Update website image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          kubectl -n "$K8S_NAMESPACE" set image \
            deployment/gawachabazaar-website \
            "website=$DOCKERHUB_USERNAME/$DOCKER_WEBSITE:$GITHUB_SHA"

      - name: Create Admin deployment if missing
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if ! kubectl -n "$K8S_NAMESPACE" get deployment gawachabazaar-admin >/dev/null 2>&1; then
            echo "Admin Deployment does not exist. Applying the Admin workload manifests."
            kubectl apply -f k8s/base/admin-deployment.yaml
            kubectl apply -f k8s/base/admin-service.yaml
            kubectl apply -f k8s/base/admin-hpa.yaml
          fi

          kubectl -n "$K8S_NAMESPACE" patch deployment gawachabazaar-admin \
            --type=merge \
            -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"dockerhub-regcred"}]}}}}'

          kubectl -n "$K8S_NAMESPACE" set image \
            deployment/gawachabazaar-admin \
            "admin=$DOCKERHUB_USERNAME/$DOCKER_ADMIN:$GITHUB_SHA"

      - name: Wait for backend rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status \
            deployment/gawachabazaar-backend --timeout=5m

      - name: Wait for website rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status \
            deployment/gawachabazaar-website --timeout=5m

      - name: Wait for Admin rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status \
            deployment/gawachabazaar-admin --timeout=5m

      - name: Verify deployment
        run: |
          kubectl -n "$K8S_NAMESPACE" get pods
          kubectl -n "$K8S_NAMESPACE" get deployments
          kubectl -n "$K8S_NAMESPACE" get hpa
