name: GawachaBazaar Production Deploy

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "544695387729"
  ECR_BACKEND: gawachabazaar-backend
  ECR_WEBSITE: gawachabazaar-website
  EKS_CLUSTER: gawachabazaar-prod
  K8S_NAMESPACE: gawachabazaar

jobs:
  build-and-deploy:
    runs-on: ubuntu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tools
        run: |
          docker --version
          aws --version
          kubectl version --client

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
              --username AWS \
              --password-stdin \
              "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Build backend image
        run: |
          docker build \
            -t "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND:$GITHUB_SHA" \
            ./backend

      - name: Build website image
        run: |
          docker build \
            -t "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_WEBSITE:$GITHUB_SHA" \
            ./website

      - name: Push backend image
        run: |
          docker push \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND:$GITHUB_SHA"

      - name: Push website image
        run: |
          docker push \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_WEBSITE:$GITHUB_SHA"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Deploy backend
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/gawachabazaar-backend \
            "backend=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND:$GITHUB_SHA"

      - name: Deploy website
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/gawachabazaar-website \
            "website=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_WEBSITE:$GITHUB_SHA"

      - name: Wait for backend rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status \
            deployment/gawachabazaar-backend \
            --timeout=5m

      - name: Wait for website rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status \
            deployment/gawachabazaar-website \
            --timeout=5m

      - name: Verify deployment
        run: |
          kubectl -n "$K8S_NAMESPACE" get pods
          kubectl -n "$K8S_NAMESPACE" get deployments
