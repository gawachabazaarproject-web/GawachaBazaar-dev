name: GawachaBazaar Production Deploy

on:
  push:
    branches:
      - main

env:
  DOCKER_BACKEND: gawachabazaar-backend
  DOCKER_WEBSITE: gawachabazaar-website
  EKS_CLUSTER: gawachabazaar-prod
  AWS_REGION: ap-south-1
  K8S_NAMESPACE: gawachabazaar

jobs:
  build-and-deploy:
    runs-on: ubuntu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tools
        run: |
          docker --version
          aws --version
          kubectl version --client

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Build backend image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build \
            -t "$DOCKERHUB_USERNAME/$DOCKER_BACKEND:$GITHUB_SHA" \
            ./backend

      - name: Build website image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build \
            -t "$DOCKERHUB_USERNAME/$DOCKER_WEBSITE:$GITHUB_SHA" \
            ./website

      - name: Push backend image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker push \
            "$DOCKERHUB_USERNAME/$DOCKER_BACKEND:$GITHUB_SHA"

      - name: Push website image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker push \
            "$DOCKERHUB_USERNAME/$DOCKER_WEBSITE:$GITHUB_SHA"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Create Docker Hub pull secret
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          kubectl create secret docker-registry dockerhub-regcred \
            -n "$K8S_NAMESPACE" \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="$DOCKERHUB_USERNAME" \
            --docker-password="$DOCKERHUB_TOKEN" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Configure backend image pull secret
        run: |
          kubectl -n "$K8S_NAMESPACE" patch deployment gawachabazaar-backend \
            -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"dockerhub-regcred"}]}}}}'

      - name: Deploy backend
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          kubectl -n "$K8S_NAMESPACE" set image \
            deployment/gawachabazaar-backend \
            "backend=$DOCKERHUB_USERNAME/$DOCKER_BACKEND:$GITHUB_SHA"

      - name: Deploy website
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          kubectl -n "$K8S_NAMESPACE" set image \
            deployment/gawachabazaar-website \
            "website=$DOCKERHUB_USERNAME/$DOCKER_WEBSITE:$GITHUB_SHA"

      - name: Wait for backend rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status \
            deployment/gawachabazaar-backend \
            --timeout=5m

      - name: Wait for website rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status \
            deployment/gawachabazaar-website \
            --timeout=5m

      - name: Verify deployment
        run: |
          kubectl -n "$K8S_NAMESPACE" get pods
          kubectl -n "$K8S_NAMESPACE" get deployments
