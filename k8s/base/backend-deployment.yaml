apiVersion: apps/v1
kind: Deployment
metadata:
  name: gawachabazaar-backend
  namespace: gawachabazaar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gawachabazaar-backend
  template:
    metadata:
      labels:
        app: gawachabazaar-backend
    spec:
      containers:
        - name: backend
          image: gawachabazaar-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: APP_NAME
              value: "GawachaBazaar"
            - name: APP_ENV
              value: "production"
            - name: DEBUG
              value: "False"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: ALLOWED_ORIGINS
              value: '["https://gawachabazaar.in","https://admin.gawachabazaar.in"]'
          envFrom:
            - secretRef:
                name: gawachabazaar-backend-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
