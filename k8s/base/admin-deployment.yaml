apiVersion: apps/v1
kind: Deployment
metadata:
  name: gawachabazaar-admin
  namespace: gawachabazaar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gawachabazaar-admin
  template:
    metadata:
      labels:
        app: gawachabazaar-admin
    spec:
      containers:
        - name: admin
          image: gawachabazaar-admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /login
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /login
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
