apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gawachabazaar-website
  namespace: gawachabazaar
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gawachabazaar-website

  minReplicas: 2
  maxReplicas: 4

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
