apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gawachabazaar-ingress
  namespace: gawachabazaar
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:544695387729:certificate/3d73d5f4-232c-466a-8eac-6662498238bd
spec:
  ingressClassName: alb
  rules:
    - host: api.gawachabazaar.in
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: gawachabazaar-backend
                port:
                  number: 8000
    - host: gawachabazaar.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gawachabazaar-website
                port:
                  number: 3000
